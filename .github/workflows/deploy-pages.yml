name: Deploy to GitHub Pages

# GitHub Pages へ公開する（main は変更しない）:
#   - ダーク版(redesign)    → https://ysasaki84.github.io/aijournal-web/
#   - ライト版(light-theme) → https://ysasaki84.github.io/aijournal-web/light/
# ソースは絶対パス(/...)前提のため、ビルド後に各プレフィックスを付与してサブパス配信に対応
# させる（ソースコードは変更しない）。どちらのブランチへ push しても両方を最新で再ビルドする。
on:
  push:
    branches: [redesign, light-theme]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # ---------- ダーク版（ルート /aijournal-web/）----------
      - name: Checkout dark (redesign)
        uses: actions/checkout@v4
        with:
          ref: redesign
      # 公開ゲート: 未解決の【要確認】を含む記事があれば公開を止める（koetsu 校閲で解決してから公開する）
      - name: 公開ゲート（ダーク）
        run: |
          if grep -rl '【要確認' src/content/episodes; then
            echo "::error::未解決の【要確認】を含む記事があります。/koetsu 校閲で解決してから公開してください。"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Rewrite dark paths for /aijournal-web/
        run: |
          find dist -type f \( -name '*.html' -o -name '*.css' \) -print0 \
            | xargs -0 perl -0pi -e 's{(["\(])/(?!/)}{$1/aijournal-web/}g'

      # ---------- ライト版（/aijournal-web/light/）----------
      - name: Checkout light (light-theme)
        uses: actions/checkout@v4
        with:
          ref: light-theme
          path: light-src
      - name: 公開ゲート（ライト）
        run: |
          if grep -rl '【要確認' light-src/src/content/episodes; then
            echo "::error::ライト版に未解決の【要確認】を含む記事があります。解決してから公開してください。"
            exit 1
          fi
      - name: Build light
        working-directory: light-src
        run: |
          npm ci
          npm run build
      - name: Rewrite light paths for /aijournal-web/light/
        run: |
          find light-src/dist -type f \( -name '*.html' -o -name '*.css' \) -print0 \
            | xargs -0 perl -0pi -e 's{(["\(])/(?!/)}{$1/aijournal-web/light/}g'

      # ---------- 結合してアップロード ----------
      - name: Combine dark + light
        run: |
          mkdir -p dist/light
          cp -R light-src/dist/. dist/light/
          touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
